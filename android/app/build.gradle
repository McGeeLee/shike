plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

def releaseSigningPropertiesFile = rootProject.file('release-signing.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def shikeVersionName = providers.environmentVariable('SHIKE_VERSION_NAME').orElse('0.0.0').get()
def shikeVersionCodeText = providers.environmentVariable('SHIKE_VERSION_CODE').orElse('1').get()
if (!(shikeVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('SHIKE_VERSION_NAME must use MAJOR.MINOR.PATCH format')
}
def shikeVersionCode
try {
    shikeVersionCode = shikeVersionCodeText.toInteger()
} catch (NumberFormatException ignored) {
    throw new GradleException('SHIKE_VERSION_CODE must be a positive integer')
}
if (shikeVersionCode < 1 || shikeVersionCode > 2100000000) {
    throw new GradleException('SHIKE_VERSION_CODE must be between 1 and 2100000000')
}

android {
    namespace = "com.gee.eatapp"
    compileSdk {
        version = release(rootProject.ext.compileSdkVersion) {
            it.minorApiLevel = rootProject.ext.compileSdkMinorVersion
        }
    }
    defaultConfig {
        applicationId = "com.gee.eatapp"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = shikeVersionCode
        versionName = shikeVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    signingConfigs {
        release {
            if (releaseSigningPropertiesFile.exists()) {
                storeFile = rootProject.file(releaseSigningProperties['storeFile'])
                storePassword = rootProject.file(releaseSigningProperties['storePasswordFile']).text.trim()
                keyAlias = releaseSigningProperties['keyAlias']
                keyPassword = rootProject.file(releaseSigningProperties['keyPasswordFile']).text.trim()
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            buildConfigField 'boolean', 'IN_APP_UPDATES_ENABLED', 'false'
        }
        release {
            buildConfigField 'boolean', 'IN_APP_UPDATES_ENABLED', 'true'
            if (releaseSigningPropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

