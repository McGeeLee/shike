name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.1"
      - run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug assembleDebug
        working-directory: android
