<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <title>食刻 · 拍照记热量</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>食刻</h1>
    <button class="gear" id="settingsBtn" aria-label="设置">⚙️</button>
  </header>

  <div class="datebar">
    <button id="prevDay" aria-label="前一天">‹</button>
    <span class="date" id="dateLabel"></span>
    <button id="nextDay" aria-label="后一天">›</button>
    <button class="today-btn" id="todayBtn" hidden>回到今天</button>
  </div>

  <main>
    <section class="summary" aria-label="当日营养汇总">
      <div class="total"><span id="totalKcal">0</span><small>/ <span id="goalKcal">2000</span> 千卡</small></div>
      <div class="goal-row">
        <span id="remainLabel">还可摄入 2000 千卡</span>
        <button id="editGoal">设置目标</button>
      </div>
      <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
      <div class="macros">
        <div>蛋白质<b id="mProtein">0g</b></div>
        <div>碳水<b id="mCarbs">0g</b></div>
        <div>脂肪<b id="mFat">0g</b></div>
      </div>
    </section>

    <button class="capture-btn" id="captureBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span id="captureLabel">拍照记录这一餐</span>
    </button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    <div class="model-label" id="modelLabel"></div>

    <section class="card">
      <h2 id="logTitle">今日记录</h2>
      <div id="entryList"><div class="empty">还没有记录，拍张照开始吧</div></div>
    </section>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="食刻操作面板" tabindex="-1"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
