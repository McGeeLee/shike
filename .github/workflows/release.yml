name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  VERSION_CODE_OFFSET: 6

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ || ! "$VERSION_CODE_OFFSET" =~ ^[0-9]+$ ]]; then
            echo "GitHub run number and version-code offset must be non-negative integers."
            exit 1
          fi
          version_name="${RELEASE_TAG#v}"
          version_code=$((10#$VERSION_CODE_OFFSET + 10#$GITHUB_RUN_NUMBER))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Generated Android versionCode is outside the supported range."
            exit 1
          fi
          printf 'SHIKE_VERSION_NAME=%s\n' "$version_name" >> "$GITHUB_ENV"
          printf 'SHIKE_VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"
          printf '### Android release\n- versionName: `%s`\n- versionCode: `%s`\n' \
            "$version_name" "$version_code" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.1 platform
        run: sdkmanager "platforms;android-37.1"

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are incomplete. See README.md for the required secret names."
            exit 1
          fi
          mkdir -p android/.signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.signing/shike-release.p12
          printf '%s' "$ANDROID_STORE_PASSWORD" > android/.signing/store-password
          printf '%s' "$ANDROID_KEY_PASSWORD" > android/.signing/key-password
          printf '%s\n' \
            'storeFile=.signing/shike-release.p12' \
            'storePasswordFile=.signing/store-password' \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            'keyPasswordFile=.signing/key-password' \
            > android/release-signing.properties
          chmod 600 android/.signing/* android/release-signing.properties

      - name: Test, lint, and build signed APK
        run: >-
          ./gradlew
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          lintDebug
          assembleRelease
          --stacktrace
          --warning-mode all
        working-directory: android

      - name: Verify and checksum APK
        shell: bash
        run: |
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "Signed release APK was not produced."
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs "$apk_path"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          package_info="$("$aapt_path" dump badging "$apk_path" | head -n 1)"
          if [[ "$package_info" != *"versionCode='$SHIKE_VERSION_CODE'"* || "$package_info" != *"versionName='$SHIKE_VERSION_NAME'"* ]]; then
            echo "APK version metadata does not match the GitHub CD version."
            echo "$package_info"
            exit 1
          fi
          mkdir -p dist
          artifact_name="shike-$RELEASE_TAG.apk"
          cp "$apk_path" "dist/$artifact_name"
          cd dist
          sha256sum "$artifact_name" > "$artifact_name.sha256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="shike-$RELEASE_TAG.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$artifact_name#食刻 $RELEASE_TAG APK" \
              "dist/$artifact_name.sha256#SHA-256" \
              --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              "dist/$artifact_name#食刻 $RELEASE_TAG APK" \
              "dist/$artifact_name.sha256#SHA-256" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "食刻 $RELEASE_TAG"
          fi
