name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v2.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag and app version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          version_name="$(grep -m1 'versionName = ' android/app/build.gradle | cut -d '"' -f 2)"
          if [[ "v$version_name" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match app version v$version_name."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37.1 platform
        run: sdkmanager "platforms;android-37.1"

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are incomplete. See README.md for the required secret names."
            exit 1
          fi
          mkdir -p android/.signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.signing/shike-release.p12
          printf '%s' "$ANDROID_STORE_PASSWORD" > android/.signing/store-password
          printf '%s' "$ANDROID_KEY_PASSWORD" > android/.signing/key-password
          printf '%s\n' \
            'storeFile=.signing/shike-release.p12' \
            'storePasswordFile=.signing/store-password' \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            'keyPasswordFile=.signing/key-password' \
            > android/release-signing.properties
          chmod 600 android/.signing/* android/release-signing.properties

      - name: Test, lint, and build signed APK
        run: >-
          ./gradlew
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          lintDebug
          assembleRelease
          --stacktrace
          --warning-mode all
        working-directory: android

      - name: Verify and checksum APK
        shell: bash
        run: |
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "Signed release APK was not produced."
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs "$apk_path"
          mkdir -p dist
          artifact_name="shike-$RELEASE_TAG.apk"
          cp "$apk_path" "dist/$artifact_name"
          cd dist
          sha256sum "$artifact_name" > "$artifact_name.sha256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="shike-$RELEASE_TAG.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$artifact_name#食刻 $RELEASE_TAG APK" \
              "dist/$artifact_name.sha256#SHA-256" \
              --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              "dist/$artifact_name#食刻 $RELEASE_TAG APK" \
              "dist/$artifact_name.sha256#SHA-256" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "食刻 $RELEASE_TAG"
          fi
