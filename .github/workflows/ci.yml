name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.1 platform
        run: sdkmanager "platforms;android-37.1"

      - name: Test, lint, and build
        run: >-
          ./gradlew
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          lintDebug
          assembleDebug
          assembleRelease
          --stacktrace
          --warning-mode all
        working-directory: android
