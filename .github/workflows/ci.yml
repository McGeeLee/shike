name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHIKE_VERSION_NAME: "0.0.${{ github.run_number }}"
      SHIKE_VERSION_CODE: "${{ github.run_number }}"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.1 platform
        run: sdkmanager "platforms;android-37.1"

      - name: Test, lint, and build
        run: >-
          ./gradlew
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          lintDebug
          assembleDebug
          assembleRelease
          --stacktrace
          --warning-mode all
        working-directory: android
