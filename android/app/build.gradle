apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseSigningPropertiesFile = rootProject.file('release-signing.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace = "com.gee.eatapp"
    compileSdk {
        version = release(rootProject.ext.compileSdkVersion) {
            it.minorApiLevel = rootProject.ext.compileSdkMinorVersion
        }
    }
    defaultConfig {
        applicationId = "com.gee.eatapp"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 4
        versionName = "2.2.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    signingConfigs {
        release {
            if (releaseSigningPropertiesFile.exists()) {
                storeFile = rootProject.file(releaseSigningProperties['storeFile'])
                storePassword = rootProject.file(releaseSigningProperties['storePasswordFile']).text.trim()
                keyAlias = releaseSigningProperties['keyAlias']
                keyPassword = rootProject.file(releaseSigningProperties['keyPasswordFile']).text.trim()
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            if (releaseSigningPropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    def versions = rootProject.ext
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    androidTestImplementation composeBom

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation "androidx.activity:activity-compose:${versions.androidxActivityVersion}"
    implementation "androidx.core:core-ktx:${versions.androidxCoreVersion}"
    implementation "androidx.core:core-splashscreen:${versions.coreSplashScreenVersion}"
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.android.material:material:1.14.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation "junit:junit:${versions.junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${versions.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${versions.androidxEspressoCoreVersion}"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
