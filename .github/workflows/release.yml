name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # A historical tag may predate the release policy. Always use the policy
      # shipped with this workflow rather than scripts from the requested tag.
      - name: Check out release policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-policy

      - name: Validate release and resolve version
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s .release-policy/.github/scripts -p 'test_*.py'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 .release-policy/.github/scripts/release_plan.py \
            --tag "$RELEASE_TAG" \
            --releases-file "$RUNNER_TEMP/releases.json" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        if: steps.plan.outputs.publish == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android 37.1 platform
        if: steps.plan.outputs.publish == 'true'
        run: sdkmanager "platforms;android-37.1"

      - name: Prepare release signing
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are incomplete. See README.md for the required secret names."
            exit 1
          fi
          mkdir -p android/.signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.signing/shike-release.p12
          printf '%s' "$ANDROID_STORE_PASSWORD" > android/.signing/store-password
          printf '%s' "$ANDROID_KEY_PASSWORD" > android/.signing/key-password
          printf '%s\n' \
            'storeFile=.signing/shike-release.p12' \
            'storePasswordFile=.signing/store-password' \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            'keyPasswordFile=.signing/key-password' \
            > android/release-signing.properties
          chmod 600 android/.signing/* android/release-signing.properties

      - name: Test, lint, and build signed APK
        if: steps.plan.outputs.publish == 'true'
        run: >-
          ./gradlew
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          lintDebug
          assembleRelease
          --stacktrace
          --warning-mode all
        working-directory: android

      - name: Verify and checksum APK
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "Signed release APK was not produced."
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs "$apk_path"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          package_info="$("$aapt_path" dump badging "$apk_path" | head -n 1)"
          if [[ "$package_info" != *"versionCode='$SHIKE_VERSION_CODE'"* || "$package_info" != *"versionName='$SHIKE_VERSION_NAME'"* ]]; then
            echo "APK version metadata does not match the GitHub CD version."
            echo "$package_info"
            exit 1
          fi
          mkdir -p dist
          artifact_name="shike-$RELEASE_TAG.apk"
          cp "$apk_path" "dist/$artifact_name"
          cd dist
          sha256sum "$artifact_name" > "$artifact_name.sha256"

      - name: Publish new GitHub Release
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed if a release was created outside this workflow while
          # the build ran. Never upload over an existing release asset.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases-before-publish.json"
          python3 .release-policy/.github/scripts/release_plan.py \
            --tag "$RELEASE_TAG" \
            --releases-file "$RUNNER_TEMP/releases-before-publish.json" \
            --require-publish
          artifact_name="shike-$RELEASE_TAG.apk"
          gh release create "$RELEASE_TAG" \
            "dist/$artifact_name#食刻 $RELEASE_TAG APK" \
            "dist/$artifact_name.sha256#SHA-256" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "食刻 $RELEASE_TAG"
