<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <meta name="color-scheme" content="light">
  <title>食刻 · 拍照记热量</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>食刻</h1>
    <button class="gear" id="settingsBtn" type="button" aria-label="打开设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/>
      </svg>
    </button>
  </header>

  <div class="datebar">
    <button id="prevDay" aria-label="前一天">‹</button>
    <time class="date" id="dateLabel"></time>
    <button id="nextDay" aria-label="后一天">›</button>
    <button class="today-btn" id="todayBtn" hidden>回到今天</button>
  </div>

  <main>
    <section class="summary" aria-label="当日营养汇总">
      <div class="total" aria-live="polite"><span id="totalKcal">0</span><small>/ <span id="goalKcal">2000</span> 千卡</small></div>
      <div class="goal-row">
        <span id="remainLabel">还可摄入 2000 千卡</span>
        <button id="editGoal">设置目标</button>
      </div>
      <div class="bar" id="calorieProgress" role="progressbar" aria-label="每日热量进度" aria-valuemin="0"><div id="barFill"></div></div>
      <div class="macros">
        <div>蛋白质<b id="mProtein">0g</b></div>
        <div>碳水<b id="mCarbs">0g</b></div>
        <div>脂肪<b id="mFat">0g</b></div>
      </div>
    </section>

    <button class="capture-btn" id="captureBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span id="captureLabel">拍照记录这一餐</span>
    </button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    <div class="model-label" id="modelLabel"></div>

    <section class="card" aria-labelledby="logTitle">
      <h2 id="logTitle">今日记录</h2>
      <div id="entryList" role="list"><div class="empty" role="listitem">还没有记录，拍张照开始吧</div></div>
    </section>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="食刻操作面板" tabindex="-1"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span id="toastMessage"></span>
    <button id="undoDeleteBtn" type="button">撤销</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
